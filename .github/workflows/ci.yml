name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run linter
        working-directory: backend
        run: npm run lint

      - name: Build
        working-directory: backend
        run: npm run build

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: salonfacil
          POSTGRES_PASSWORD: salonfacil_dev_password
          POSTGRES_DB: salonfacil_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U salonfacil -d salonfacil_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DATABASE_URL: postgresql://salonfacil:salonfacil_dev_password@localhost:5434/salonfacil_test
      DATABASE_URL: postgresql://salonfacil:salonfacil_dev_password@localhost:5434/salonfacil_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_e2e_jwt_secret_min_32_characters_long
      JWT_REFRESH_SECRET: ci_e2e_refresh_secret_min_32_characters_long
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      BCRYPT_ROUNDS: 4
      CORS_ORIGINS: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Prepare test database
        working-directory: backend
        run: node scripts/setup-e2e-db.js

      - name: Run unit tests
        working-directory: backend
        run: npm run test

      - name: Run e2e tests
        working-directory: backend
        run: npm run test:e2e

  frontend-lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linter
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
